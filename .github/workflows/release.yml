name: WisDev Arc Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: orchestrator/go.sum

      - name: Cross-compile wisdev CLI
        working-directory: orchestrator
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p ../release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            ext=""
            [ "$GOOS" = "windows" ] && ext=".exe"
            out="wisdev${ext}"
            echo "Building ${GOOS}/${GOARCH}"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/wisdev
            base="wisdev_${VERSION}_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              zip -q "../release/${base}.zip" "$out"
            else
              tar -czf "../release/${base}.tar.gz" "$out"
            fi
            rm "$out"
          done
          (cd ../release && sha256sum * > SHA256SUMS)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "WisDev ${GITHUB_REF_NAME}" \
            --generate-notes
